# Explicit project name -- without this, Compose defaults to the compose
# file's parent directory name ("docker", from infra/docker/), producing
# unhelpful container names like docker-api-1, docker-mongo-1 that give no
# indication which project they belong to when running `docker ps` next to
# other projects' containers.
name: synthveda

services:

  # ------------------------------------------------------------------
  # API — FastAPI backend
  # ------------------------------------------------------------------
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: synthveda
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      UPLOAD_STORAGE_DIR: /app/uploads
      MODELS_REGISTRY_PATH: /app/models/registry
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/api/app:/app/app    # hot-reload in dev
      - uploads_data:/app/uploads
      - ../../models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Worker — background job processor
  # ------------------------------------------------------------------
  worker:
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: synthveda
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "2"
      MODELS_REGISTRY_PATH: /app/models/registry
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/worker/app:/app/app  # hot-reload in dev
      - uploads_data:/app/uploads
      - ../../models:/app/models

  # ------------------------------------------------------------------
  # MongoDB — raw analysis documents
  # ------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: synthveda-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Redis — job queue for worker
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: synthveda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Frontend — React SPA served via nginx
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ../../web_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: synthveda-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  uploads_data:
