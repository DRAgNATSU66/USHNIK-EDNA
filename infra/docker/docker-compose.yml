# Explicit project name -- without this, Compose defaults to the compose
# file's parent directory name ("docker", from infra/docker/), producing
# unhelpful container names like docker-api-1, docker-mongo-1 that give no
# indication which project they belong to when running `docker ps` next to
# other projects' containers.
name: synthveda

# Upload storage (B7, services/*/app/storage.py). Compose runs the s3 backend
# against the minio service below; set STORAGE_BACKEND=local to fall back to
# the shared uploads_data volume. The API writes, the worker reads, so both
# get the same values. MINIO_ROOT_USER / MINIO_ROOT_PASSWORD come from the
# shell or infra/docker/.env; the defaults are dev-only.
x-object-storage-env: &object-storage-env
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  OBJECT_STORAGE_URL: http://minio:9000
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-synthveda-uploads}
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-synthveda}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-synthveda-dev-secret}
  OBJECT_STORAGE_REGION: us-east-1

services:

  # ------------------------------------------------------------------
  # API — FastAPI backend
  # ------------------------------------------------------------------
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      # dev skips the JWT_SECRET startup check (B18, app/config.py). Set
      # APP_ENV=production (and a real JWT_SECRET) to exercise it locally.
      APP_ENV: ${APP_ENV:-dev}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: synthveda
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      UPLOAD_STORAGE_DIR: /app/uploads
      MODELS_REGISTRY_PATH: /app/models/registry
      # POST /models/register and /promote verify artifact checksums under the
      # data root and write models/registry (shared with the worker) (B8).
      # Abyss loads the router.npz named by the registry from here (B25).
      SYNTHVEDA_DATA_ROOT: /data
      <<: *object-storage-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../../services/api/app:/app/app    # hot-reload in dev
      - uploads_data:/app/uploads
      - ../../models:/app/models
      - ${SYNTHVEDA_DATA_HOST_DIR:-../../synthveda-data}:/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Worker — background job processor
  # ------------------------------------------------------------------
  worker:
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: synthveda
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "2"
      MODELS_REGISTRY_PATH: /app/models/registry
      # local:// uploads resolve here: the same uploads_data volume the API
      # writes to.
      UPLOAD_STORAGE_DIR: /app/uploads
      # data: registry paths (backbones, heads, router.npz) resolve here (B24).
      SYNTHVEDA_DATA_ROOT: /data
      <<: *object-storage-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../../services/worker/app:/app/app  # hot-reload in dev
      - uploads_data:/app/uploads
      - ../../models:/app/models
      - ${SYNTHVEDA_DATA_HOST_DIR:-../../synthveda-data}:/data:ro

  # ------------------------------------------------------------------
  # MongoDB — raw analysis documents
  # ------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: synthveda-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Redis — job queue for worker
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: synthveda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO -- S3-compatible object storage for uploads (B7)
  # ------------------------------------------------------------------
  # pgsty/minio is the maintained community build (MinIO Inc. stopped
  # publishing images); it bundles the `mc` client used by minio-init.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: synthveda-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synthveda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-synthveda-dev-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot: create the uploads bucket (idempotent), then exit 0. api and
  # worker wait for it (service_completed_successfully).
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synthveda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-synthveda-dev-secret}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-synthveda-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set synthveda http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "synthveda/$$OBJECT_STORAGE_BUCKET"
    restart: "no"

  # ------------------------------------------------------------------
  # Frontend — React SPA served via nginx
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ../../web_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: synthveda-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  uploads_data:   # local storage backend (STORAGE_BACKEND=local)
  minio_data:     # s3 storage backend: the MinIO bucket contents
