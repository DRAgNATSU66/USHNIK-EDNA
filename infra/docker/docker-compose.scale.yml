# docker-compose.scale.yml — Local horizontal scaling test overlay.
#
# Runs multiple worker instances and multiple API instances behind a
# simple nginx load balancer. Use this to verify the system behaves
# correctly when scaled horizontally before deploying to Cloud Run.
#
# Usage:
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.scale.yml \
#     up --build --scale worker=4 --scale api=2

services:

  # Nginx load balancer — routes traffic across multiple API instances.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Scale the API: --scale api=N (do not expose port 8000 directly)
  api:
    ports: []  # remove direct port binding — traffic goes through nginx
    environment:
      WORKER_CONCURRENCY: "4"

  # Scale workers independently: --scale worker=N
  worker:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
