# nginx-lb.conf — local load balancer for docker-compose scale testing.
# Used only with docker-compose.scale.yml.

upstream synthveda_api {
    least_conn;
    server api:8000;
}

# Rate limits (B18), keyed per client IP.
#   admin_redeem: POST /auth/admin-key/redeem. Invite keys are 8 alphanumeric
#     characters; app/auth/router.py leaves brute-force protection to the
#     proxy. 5/min with a burst of 5 lets a person retype a key a few times;
#     beyond that a guesser gets about 7,200 tries a day per IP.
#   auth_login: the sign-in exchanges. Each call costs an outbound round trip
#     to Google or Supabase, so cap them at 30/min, burst 20 (a page reload
#     storm or a few users behind one NAT still fit).
# 10m of shared memory holds ~160k IPv4 states per zone.
limit_req_zone $binary_remote_addr zone=admin_redeem:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_login:10m   rate=30r/m;
limit_req_status    429;
limit_req_log_level warn;

server {
    listen 80;

    # Inherited by every location below (none sets its own proxy_set_header).
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /auth/admin-key/redeem {
        limit_req  zone=admin_redeem burst=5 nodelay;
        proxy_pass http://synthveda_api;
    }

    location = /auth/google/code-exchange {
        limit_req  zone=auth_login burst=20 nodelay;
        proxy_pass http://synthveda_api;
    }

    location = /auth/supabase/exchange {
        limit_req  zone=auth_login burst=20 nodelay;
        proxy_pass http://synthveda_api;
    }

    location / {
        proxy_pass http://synthveda_api;
    }
}
