# nginx-lb.conf — local load balancer for docker-compose scale testing.
# Used only with docker-compose.scale.yml.

upstream synthveda_api {
    least_conn;
    server api:8000;
}

server {
    listen 80;

    location / {
        proxy_pass         http://synthveda_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
