apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: synthveda-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        # Static files — throttle CPU when idle to reduce cost.
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 30
      containers:
        - image: us-docker.pkg.dev/YOUR_PROJECT_ID/synthveda/frontend:IMAGE_TAG
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 5
  traffic:
    - percent: 100
      latestRevision: true
